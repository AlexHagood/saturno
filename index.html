<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A ninety-second living wall painting after Goya's Saturn Devouring His Son.">
<title>Saturno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* One dark room: a living wall painting on a full-bleed canvas, one line of text at a time. */
:root{
  color-scheme: dark;
  --void:#060504;
  --bone:#cdbf9f;
  --ash:#81755f;
  --rust:#8a2a1c;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --caps:"IM Fell English SC","IM Fell English","Palatino Linotype",Georgia,serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);overflow:hidden}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void)}
.line{position:fixed;left:16px;right:16px;margin:0 auto;max-width:32em;text-align:center;pointer-events:none;opacity:0;
  text-wrap:balance;text-shadow:0 0 1.4em #000,0 0 .35em #000}
#line{bottom:calc(11vh + env(safe-area-inset-bottom,0px));font-style:italic;font-size:clamp(19px,2.3vw,30px);line-height:1.35}
#count{bottom:calc(5vh + env(safe-area-inset-bottom,0px));font-family:var(--caps);font-size:clamp(13px,1.3vw,16px);
  letter-spacing:.12em;color:var(--ash);font-variant-numeric:tabular-nums}
#gate{position:fixed;inset:0;display:grid;align-items:end;justify-items:center;padding:0 16px calc(8vh + env(safe-area-inset-bottom,0px));
  transition:opacity 1.6s ease}
#gate.leaving{opacity:0}
.gate-inner{display:grid;gap:18px;justify-items:center;text-align:center;max-width:30em}
.after{font-family:var(--caps);letter-spacing:.24em;font-size:13px;color:var(--ash);margin:0}
h1{font-family:var(--caps);font-weight:400;font-size:clamp(46px,7.5vw,92px);letter-spacing:.2em;padding-left:.2em;margin:0;line-height:.95;color:var(--bone)}
.warn{font-style:italic;color:var(--ash);font-size:clamp(15px,1.5vw,18px);line-height:1.55;margin:0}
button{font:inherit;font-family:var(--caps);font-size:15px;letter-spacing:.26em;color:var(--bone);background:transparent;cursor:pointer;
  border:1px solid rgba(205,191,159,.35);padding:.8em 2.1em .75em 2.36em;transition:border-color .5s,color .5s,background-color .5s}
button:hover{border-color:var(--rust);background-color:rgba(138,42,28,.14);color:#efe2c4}
button:focus-visible{outline:1px solid var(--bone);outline-offset:5px}
#again{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;font-size:12px;padding:.55em 1.3em .5em 1.5em;opacity:.55}
#again:hover{opacity:1}
</style>
</head>
<body>
<canvas id="c" aria-label="A slowly moving painting of Saturn devouring his son"></canvas>
<p id="line" class="line" aria-live="polite"></p>
<p id="count" class="line"></p>
<button id="again" type="button" hidden>Again</button>

<div id="gate">
  <div class="gate-inner">
    <p class="after">after goya &middot; 1819&ndash;1823</p>
    <h1>Saturno</h1>
    <p class="warn">Headphones. Lights off. About ninety seconds.</p>
    <button id="begin" type="button">Begin</button>
  </div>
</div>

<script>
(() => {
const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const lineEl = document.getElementById('line');
const countEl = document.getElementById('count');
const gate = document.getElementById('gate');
const againBtn = document.getElementById('again');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const gl = canvas.getContext('webgl', {antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance'});
if (!gl) { lineEl.textContent = 'This painting needs WebGL, and this browser has it turned off.'; lineEl.style.opacity = 1; return; }

/* ------------------------------------------------------------------ */
/*  The painting. Every form is a soft signed-distance shape, lit by   */
/*  one candle from the upper left, then cracked like old plaster.     */
/* ------------------------------------------------------------------ */
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uTime, uFade;
uniform vec3 uCam;
uniform float uLight, uJaw, uPupil, uEyeOpen, uEyeGlow, uSon, uReach, uBlood, uScare, uBreath, uBite;
uniform vec2 uLook;
#define PI 3.14159265

float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
const mat2 M2 = mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=M2*p; a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=M2*p; a*=.5; } return v; }

float sdE(vec2 p, vec2 c, vec2 r){ p-=c; float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.)/max(k1,1e-5); }
float sdT(vec2 p, vec2 a, vec2 b, float ra, float rb){
  vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/(dot(ba,ba)+1e-8),0.,1.);
  return length(pa-ba*h)-mix(ra,rb,h); }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float msk(float d){ return smoothstep(.0025,-.0025,d); }

struct S { float h; vec3 c; float sp; float gl; float ao; };

void lay(inout S s, float d, float base, float r, vec3 col, float sp){
  float m = msk(d);
  float x = clamp(-d/r, 0., 1.);
  float h = base + r*sqrt(x*(2.-x));
  s.ao *= 1. - .6*(1.-smoothstep(0., .03, d))*(1.-m);
  s.ao = mix(s.ao, 1., m);
  s.h = mix(s.h, h, m);
  s.c = mix(s.c, col, m);
  s.sp = mix(s.sp, sp, m);
  s.gl *= 1.-m;
}

// a long, bony hand. sd=+1 sits on the viewer's left. rc blends grip -> reaching.
float hand(vec2 q, vec2 P, float sd, float k, float rc, float sq){
  float d = sdE(q, P, vec2(.027,.032)*k);
  for(int i=0;i<4;i++){
    float fi = float(i);
    vec2 bG = P + vec2(sd*.017, .022 - fi*.0155)*k;
    float aG = (sd>0. ? 0. : PI) - sd*(.1 + fi*.06);
    vec2 bR = P + vec2(sd*(.014 - fi*.0095), .027 + .005*(1.5-abs(fi-1.5)))*k;
    float aR = PI*.5 - sd*(.34 - fi*.27);
    vec2 b = mix(bG, bR, rc);
    float a = mix(aG, aR, rc);
    float l1 = (.04 + .004*sin(fi*2.3))*k*(i==3 ? .8 : 1.);
    float l2 = l1*.84;
    float cu = mix(-sd*(.5 + sq*.35), (PI*.5 - aR)*.9, rc);
    vec2 j = b + l1*vec2(cos(a), sin(a));
    vec2 t = j + l2*vec2(cos(a+cu), sin(a+cu));
    d = smin(d, sdT(q, b, j, .0105*k, .0088*k), .007);
    d = smin(d, sdT(q, j, t, .0088*k, .0052*k), .003);
  }
  vec2 tb = mix(P + vec2(sd*.004, .026)*k, P + vec2(sd*.022, -.004)*k, rc);
  float ta = mix(sd>0. ? .75 : PI-.75, sd>0. ? .2 : PI-.2, rc);
  vec2 tj = tb + .029*k*vec2(cos(ta), sin(ta));
  float tc = mix(-sd*.55, sd*.35, rc);
  vec2 tt = tj + .023*k*vec2(cos(ta+tc), sin(ta+tc));
  d = smin(d, sdT(q, tb, tj, .012*k, .0092*k), .008);
  d = smin(d, sdT(q, tj, tt, .0092*k, .006*k), .003);
  return d;
}

void eye(inout S s, vec2 q, vec2 e, float r, float full){
  float d = max(length(q-e) - r, (q.y - e.y) - r*(2.*uEyeOpen - 1.));
  float rr = length(q-e)/r;
  vec3 wc = mix(vec3(.86,.82,.7), vec3(.6,.32,.26), smoothstep(.55,1.05,rr)*.35);
  if(full > .5){
    float vn = 1. - abs(2.*noise(q*260.) - 1.);
    wc = mix(wc, vec3(.5,.08,.06), pow(vn,12.)*smoothstep(.4,.95,rr)*.5);
  }
  vec2 pc = e + uLook*r*.5;
  float di = length(q-pc);
  float ir = r*.28, pr = r*.19*uPupil;
  vec3 irc = vec3(.13,.08,.04);
  if(full > .5) irc *= .55 + .8*noise(normalize(q-pc+1e-5)*13. + di*300.);
  float mi = smoothstep(ir+.0012, ir-.0012, di);
  wc = mix(wc, irc, mi);
  wc = mix(wc, vec3(.008,.006,.005), smoothstep(pr+.001, pr-.001, di));
  lay(s, d, .1, r*.9, wc, .9);
  s.gl = max(s.gl, msk(d)*(1. - mi));
  s.c = mix(s.c, vec3(.2,.05,.035), smoothstep(.006,.0,abs(d+.0015))*.75);
}

S scene(vec2 p, float full){
  S s; s.h = 0.; s.sp = 0.; s.gl = 0.; s.ao = 1.; s.c = vec3(.03,.022,.015);
  if(full > .5){ float bn = fbm3(p*3.); s.c = mix(vec3(.025,.018,.012), vec3(.11,.075,.042), bn*bn*1.5); }

  vec2 w = vec2(noise(p*15.+3.1), noise(p*15.+8.7)) - .5;
  w += .45*(vec2(noise(p*52.+1.7), noise(p*52.+5.2)) - .5);
  vec2 q = p + w*.011;
  q.y -= uBreath*.0045;

  vec3 sat = vec3(.56,.45,.31);
  vec3 bl = vec3(.33,.022,.014);
  float var = full > .5 ? fbm3(q*11.) : .5;
  vec3 satV = mix(sat*vec3(.8,.86,.76), sat*vec3(1.08,1.,.9), var);

  // torso, shoulders, neck
  float dt = sdE(q, vec2(-.005,-.01), vec2(.165,.22));
  dt = smin(dt, sdT(q, vec2(-.2,.125), vec2(.19,.135), .052, .048), .07);
  dt = smin(dt, sdT(q, vec2(-.014,.18), vec2(-.008,.07), .042, .055), .03);
  vec3 tc = vec3(.2,.155,.105)*mix(.75,1.2,var);
  if(full > .5){
    float rib = sin((q.y + .012*sin(q.x*16.))*88.);
    tc *= 1. - .3*smoothstep(.2,1.,rib)*smoothstep(.04,.13,abs(q.x))*smoothstep(.2,.0,q.y);
  }
  lay(s, dt, 0., .1, tc, 0.);

  // thighs and knees, crouched
  float dk = sdE(q, vec2(-.25,-.33), vec2(.085,.075));
  dk = smin(dk, sdT(q, vec2(-.25,-.33), vec2(-.12,-.13), .07, .09), .03);
  dk = smin(dk, sdT(q, vec2(-.265,-.37), vec2(-.22,-.64), .058, .045), .03);
  float dk2 = sdE(q, vec2(.235,-.40), vec2(.075,.07));
  dk2 = smin(dk2, sdT(q, vec2(.235,-.40), vec2(.12,-.17), .065, .085), .03);
  dk2 = smin(dk2, sdT(q, vec2(.25,-.43), vec2(.215,-.68), .052, .042), .03);
  lay(s, min(dk,dk2), .02, .085, satV*.85, 0.);

  // arms
  float hk = mix(1., 1.25, uReach);
  vec2 Pl = mix(vec2(-.118,-.04), vec2(-.15,.03), uReach);
  vec2 Pr = mix(vec2(.118,-.02), vec2(.15,.045), uReach);
  vec2 el = mix(vec2(-.285,-.07), vec2(-.3,-.1), uReach);
  vec2 er = mix(vec2(.272,-.075), vec2(.29,-.085), uReach);
  vec2 wl = Pl + mix(vec2(-.024,-.008), vec2(0.,-.032), uReach)*hk;
  vec2 wr = Pr + mix(vec2(.024,-.008), vec2(0.,-.032), uReach)*hk;
  float da = smin(sdT(q, vec2(-.2,.12), el, .034, .026), sdT(q, el, wl, .026, .02), .012);
  float db = smin(sdT(q, vec2(.19,.13), er, .033, .025), sdT(q, er, wr, .025, .019), .012);
  lay(s, min(da,db), .03, .034, satV*.92, 0.);

  // hair, wild and grey
  vec2 hv = q - vec2(-.02,.27); float hr = length(hv); vec2 hd = hv/max(hr,1e-4);
  float sp1 = fbm3(hd*3.2 + hr*1.5) + .35*(noise(hd*16. + hr*3.) - .5);
  float dh = sdE(q, vec2(-.05,.295), vec2(.15,.135)) - .06*(sp1-.4);
  dh = smin(dh, sdT(q, vec2(-.11,.27), vec2(-.25,.08), .07, .012) - .035*(sp1-.45), .05);
  dh = smin(dh, sdT(q, vec2(.05,.3), vec2(.125,.16), .05, .008) - .025*(sp1-.45), .04);
  vec3 hcol = vec3(.5,.48,.44);
  if(full > .5){
    float st = noise(hd*42. + vec2(hr*4.) + w*3.)*.6 + noise(hd*115. + vec2(hr*9.))*.4;
    hcol *= (.12 + 1.3*st*st*st)*(.6 + .6*fbm3(q*9.));
  }
  lay(s, dh, .02, .045, hcol, .05);

  // head and jaw
  float jw = uJaw;
  vec2 mc = vec2(-.01, .193 - .02*jw);
  vec2 mr = vec2(.038 + .009*jw, .009 + .03*jw);
  float dhd = sdE(q, vec2(-.012,.262), vec2(.066,.088));
  dhd = smin(dhd, sdE(q, vec2(-.011,.212), vec2(.06,.05)), .025);
  dhd = smin(dhd, sdE(q, vec2(-.009, .17 - .032*jw), vec2(.045, .036 + .011*jw)), .025);
  float hol = exp(-dot(q-vec2(-.058,.215), q-vec2(-.058,.215))/.0006) + exp(-dot(q-vec2(.038,.22), q-vec2(.038,.22))/.0005)
            + .8*exp(-dot(q-vec2(-.072,.3), q-vec2(-.072,.3))/.0005) + .8*exp(-dot(q-vec2(.05,.305), q-vec2(.05,.305))/.0005);
  vec3 fc = satV*(1. - .35*hol);
  lay(s, dhd, .05, .075, fc, .06);
  float mh = msk(dhd);
  vec2 e1 = vec2(-.047,.283), e2 = vec2(.029,.289);
  float so = exp(-dot(q-e1,q-e1)/.0011) + exp(-dot(q-e2,q-e2)/.001);
  float brow = exp(-pow((q.y-.318)/.012, 2.)) * smoothstep(.085,.0,abs(q.x+.01));
  s.h += mh*(-.03*so + .012*brow - .02*hol);
  s.c *= 1. - mh*.45*so;
  float dn = sdT(q, vec2(-.012,.285), vec2(-.007,.229), .008, .015);
  s.h += msk(dn)*.012*sqrt(clamp(-dn/.012,0.,1.));
  float nos = min(length(q-vec2(-.019,.226)), length(q-vec2(.004,.226))) - .0045;
  s.c *= 1. - .65*msk(nos)*mh;

  float dhf = sdE(q, vec2(-.016,.375), vec2(.105,.07)) - .03*(sp1-.4);
  dhf = min(dhf, sdT(q, vec2(-.07,.33), vec2(-.09,.2), .016, .004) - .01*(sp1-.4));
  dhf = min(dhf, sdT(q, vec2(.048,.335), vec2(.068,.22), .013, .004) - .01*(sp1-.4));
  lay(s, dhf, .1, .03, hcol, .05);

  // eyes: too wide, too white
  float bulge = mix(1., 1.2, uScare);
  eye(s, q, e1, .023*bulge, full);
  eye(s, q, e2, .021*bulge, full);

  // mouth
  float dm = sdE(q, mc, mr);
  float mm = msk(dm);
  float my = (q.y - mc.y)/mr.y;
  lay(s, dm, .03, .02, mix(vec3(.025,.005,.004), vec3(.2,.04,.03), smoothstep(-.1,-.85,my)*.8*(1. - smoothstep(.006,.03,-dm))), .3);
  s.c = mix(s.c, vec3(.3,.08,.05), smoothstep(.006,.0,abs(dm))*mh*.6);
  float tx = (q.x + 1.)*115.;
  float tcl = floor(tx), tf = fract(tx);
  float tl = hash(vec2(tcl, 7.)), tu = hash(vec2(tcl, 3.));
  float cols = step(.14, tf)*step(tf, .86);
  float lowT = mm*step(my, 0.)*step(-dm, .004 + .004*tl)*cols*step(.4, tl);
  vec3 tooth = vec3(.5,.41,.26);
  s.c = mix(s.c, tooth*(.7+.4*tl)*mix(1.,.45,smoothstep(.0,.007,-dm)), lowT); s.h = mix(s.h, .1, lowT); s.sp = mix(s.sp, .5, lowT);
  // blood on lips and chin
  if(full > .5){
    vec2 sm = (q - vec2(-.01,.165))/vec2(.055,.05);
    float smear = smoothstep(.45,.75, fbm3(q*38.)) * exp(-dot(sm,sm)) * mh * (1.-mm);
    s.c = mix(s.c, bl, smear*(.55 + .45*uBlood)); s.sp = mix(s.sp, .7, smear);
  }
  float cd = 1e3;
  for(int i=0;i<3;i++){
    float fi = float(i);
    vec2 o = vec2(mc.x - .022 + fi*.021 + .006*hash(vec2(fi,2.)), mc.y - mr.y*.8);
    float len = (.02 + .035*hash(vec2(fi,5.)))*clamp(uBlood*1.4 - fi*.15, 0., 1.);
    vec2 qq = q; qq.x -= .002*sin(q.y*80. + fi*2.);
    float rk = smoothstep(.0,.015,len);
    cd = min(cd, min(sdT(qq, o, o - vec2(0.,len), .0028*rk, .002*rk), length(qq - o + vec2(0.,len)) - .0036*step(.015,len)));
  }
  float mcd = msk(max(cd, dhd));
  s.c = mix(s.c, bl, mcd*.9); s.sp = mix(s.sp, .15, mcd);

  // saturn's hands (computed early so the son can bruise under them)
  float dH = min(hand(q, Pl, 1., hk, uReach, uBite), hand(q, Pr, -1., hk, uReach, uBite));

  // the son
  if(uSon > .5){
    vec2 b = q - vec2(0., uBite*.0035);
    float ds = sdT(b, vec2(.004,.1), vec2(-.002,-.125), .049, .04);
    ds = smin(ds, sdE(b, vec2(.002,.108), vec2(.064,.03)), .03);
    // his neck disappears into the mouth
    ds = smin(ds, sdT(b, vec2(0.,.12), vec2(-.006, mc.y + mr.y*.3), .03, .024), .025);
    ds = smin(ds, sdE(b, vec2(-.002,-.18), vec2(.055,.05)), .035);
    float dl = smin(sdT(b, vec2(-.024,-.2), vec2(-.078,-.355), .033, .024), sdT(b, vec2(-.078,-.355), vec2(-.058,-.52), .023, .015), .008);
    float dr = smin(sdT(b, vec2(.026,-.2), vec2(.052,-.37), .032, .023), sdT(b, vec2(.052,-.37), vec2(.03,-.535), .022, .014), .008);
    ds = smin(ds, min(dl,dr), .012);
    vec3 sc = vec3(.72,.58,.45);
    if(full > .5) sc *= mix(vec3(.82,.8,.86), vec3(1.08,1.,.92), fbm3(b*9.)) * (.9 + .16*noise(b*40.));
    sc = mix(sc, vec3(.45,.15,.13), (1.-smoothstep(.0,.02,dH))*.6);
    lay(s, ds, .07, .05, sc, .04);
    float ms = msk(ds);
    float spine = exp(-pow((b.x - .004 + .01*(b.y-.088))/.004, 2.)) * smoothstep(.1,.05,b.y) * smoothstep(-.14,-.08,b.y);
    float cleft = exp(-pow((b.x+.002)/.0035, 2.)) * smoothstep(-.14,-.17,b.y) * smoothstep(-.24,-.2,b.y);
    s.h -= ms*(.006*spine + .014*cleft);
    // blood running down the back
    float dd = 1e3;
    for(int i=0;i<7;i++){
      float fi = float(i);
      float hx = hash(vec2(fi,3.7)), hl = hash(vec2(fi,9.1)), hdl = hash(vec2(fi,1.3));
      vec2 o = vec2(-.03 + hx*.06, .15 - hdl*.035);
      float len = (.05 + hl*.19)*clamp(uBlood*1.5 - hdl*.5, 0., 1.);
      vec2 qq = b; qq.x -= .0025*sin(b.y*70. + fi*3.);
      float rk = smoothstep(.0,.02,len);
      dd = min(dd, min(sdT(qq, o, o - vec2(0.,len), .0026*rk, .0018*rk), length(qq - o + vec2(0.,len)) - .0034*step(.02,len)));
    }
    float mdd = msk(max(dd, ds - .001));
    s.c = mix(s.c, bl*(.7 + .5*noise(b*90.)), mdd*.9); s.sp = mix(s.sp, .12, mdd);
    // the arm he has left, hanging
    float dA = smin(sdT(b, vec2(.054,.104), vec2(.072,.0), .019, .015), sdT(b, vec2(.072,.0), vec2(.064,-.1), .015, .011), .006);
    dA = smin(dA, sdE(b, vec2(.062,-.112), vec2(.011,.017)), .006);
    lay(s, dA, .1, .018, sc*.92, .12);
    // blood where the neck meets the teeth
    s.c = mix(s.c, bl*(.55 + .6*noise(b*70.)), msk(ds)*smoothstep(.12,.17,b.y)*smoothstep(.35,.6,fbm3(b*vec2(25.,6.)) + .25*smoothstep(.15,.18,b.y)));
  }

  // upper teeth close over whatever is in the mouth
  float upT = mm*step(0., my)*step(-dm, .005 + .006*tu)*cols*step(.28, tu);
  s.c = mix(s.c, tooth*(.75+.35*tu)*mix(1.,.45,smoothstep(.0,.008,-dm)), upT); s.h = mix(s.h, .12, upT); s.sp = mix(s.sp, .5, upT);
  s.c = mix(s.c, vec3(.03,.005,.004), mm*smoothstep(.0,.8,my)*(1.-upT)*.5*uSon);

  // hands, in front of everything
  vec3 hcl = satV*1.12;
  if(full > .5){

    lookGoal = wander;
  }
  const lk = 1 - Math.exp(-dt*22);
  look[0] += (lookGoal[0] - look[0])*lk; look[1] += (lookGoal[1] - look[1])*lk;

  // heartbeat during the stare; breathing in the quiet
  if (mode === 'run' && t > 41.5 && t < 58){
    const bpm = lerp(58, 104, ramp(t, 41.5, 57.8));
    if (t - lastBeat > 60/bpm){ lastBeat = t; heartbeat(lerp(.3, .85, ramp(t, 41.5, 57.8))); }
  }
  const breathing = mode === 'run' && ((t > 43 && t < 56) || t > END0 + 3);
  if (breathing && t > nextBreath){ nextBreath = t + 4.8 + Math.random()*1.2; breathe(t > END0 ? .1 : .16); }

  if (mode === 'run' && A && !freeze) for (const ev of EVENTS) if (!fired.has(ev) && t >= ev[0]){ fired.add(ev); ev[1](); }

  // words
  if (mode === 'run'){
    let cue = null, op = 0;
    for (const c of CUES) if (t >= c[0] && t < c[1]){ cue = c; op = ramp(t, c[0], c[0] + 1.1)*(1 - ramp(t, c[1] - 1.1, c[1])); }
    if (cue !== shownCue){ shownCue = cue; lineEl.textContent = cue ? cue[2] : ''; }
    lineEl.style.opacity = op.toFixed(3);
    if (t > COUNT_AT){
      const txt = 'He has eaten ' + fmt((nowMs - born)/1000) + ' of your life.';
      if (countEl.textContent !== txt) countEl.textContent = txt;
      countEl.style.opacity = (ramp(t, COUNT_AT, COUNT_AT + 2)*.9).toFixed(3);
    }
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, now);
  gl.uniform1f(U.uFade, fade);
  gl.uniform3f(U.uCam, cam[0], cam[1], z);
  gl.uniform1f(U.uLight, light);
  gl.uniform1f(U.uJaw, jaw);
  gl.uniform1f(U.uPupil, pupil);
  gl.uniform1f(U.uEyeOpen, eyeOpen);
  gl.uniform1f(U.uEyeGlow, eyeGlow);
  gl.uniform1f(U.uSon, son);
  gl.uniform1f(U.uReach, reach);
  gl.uniform1f(U.uBlood, blood);
  gl.uniform1f(U.uScare, scare);
  gl.uniform1f(U.uBreath, Math.sin(now*2*Math.PI/4.8));
  gl.uniform1f(U.uBite, bite);
  gl.uniform2f(U.uLook, look[0], look[1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
